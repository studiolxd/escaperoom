packages:
  - packages/*

# pnpm 12 exige declarar el destino de los scripts de instalación de las
# dependencias (strictDepBuilds). Los `false` son scripts que pnpm ya ignoraba;
# denegarlos explícitamente evita el error ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  better-sqlite3: false
  "@parcel/watcher": false
  "@swc/core": false
  msgpackr-extract: false
  sharp: false
  unrs-resolver: false
  # El binario nativo de @sentry/cli solo hace falta para subir source maps
  # (SENTRY_AUTH_TOKEN, ticket 6.4); sin él el build funciona igual.
  '@sentry/cli': false

# pnpm 12 exige un día mínimo de antigüedad de las releases; estas se publicaron
# hoy y son necesarias para el toolchain (añadido por `pnpm install`).
minimumReleaseAgeExclude:
  - "@typescript-eslint/eslint-plugin@8.70.1"
  - "@typescript-eslint/parser@8.70.1"
  - "@typescript-eslint/project-service@8.70.1"
  - "@typescript-eslint/scope-manager@8.70.1"
  - "@typescript-eslint/tsconfig-utils@8.70.1"
  - "@typescript-eslint/type-utils@8.70.1"
  - "@typescript-eslint/types@8.70.1"
  - "@typescript-eslint/typescript-estree@8.70.1"
  - "@typescript-eslint/utils@8.70.1"
  - "@typescript-eslint/visitor-keys@8.70.1"
  - typescript-eslint@8.70.1

# TypeScript 7 todavía no lo soporta typescript-eslint (error "does not support
# TS 7.0"), así que se fija la última 6.x. Se subirá cuando el toolchain lo
# soporte.
#
# §9.5 (pnpm audit): @better-auth/cli@1.4.21 fija internamente better-auth
# 1.4.21 (con el drizzle-adapter ese better-auth trae drizzle-orm 0.41.0) —
# ninguna versión publicada de @better-auth/cli (incluidas las 1.5 beta) usa
# todavía un better-auth >= 1.6.22, así que se fuerza aquí a la misma versión
# que ya usa el runtime (better-auth@1.7.5, no afectada) y se sube drizzle-orm
# a la mínima parcheada (GHSA-gpj5-g38j-94v9) dentro del rango que exige el
# adapter de esa versión (^0.45.2). lodash y deepmerge-ts también a sus
# mínimas parcheadas (transitivos de @colyseus/core>@pm2/io y @prisma/config).
#
# mysql2 (PR de migración a Prisma 7): prisma@7.10.0 trae mysql2@3.15.3 como
# dependencia directa (Studio/@prisma/dev, MySQL no se usa aquí — este repo
# solo habla con Postgres) y pnpm dedupea a esa misma versión el mysql2 que ya
# traía better-auth/drizzle-orm (peer opcional), de ahí que `pnpm audit --prod`
# la reporte por las dos rutas. Vulnerable: GHSA-3f6p-5ww8-9rcr (<3.22.0, alta)
# y GHSA-rgwj-5xj2-c3m3 (<=3.23.0, moderada). Se fuerza a la mínima parcheada
# de ambas.
overrides:
  typescript: ^6.0.3
  "@types/node": ^26.6.2
  better-auth: 1.7.5
  drizzle-orm: ^0.45.3
  lodash: ^4.18.1
  deepmerge-ts: ^8.0.2
  mysql2: ^3.23.1
