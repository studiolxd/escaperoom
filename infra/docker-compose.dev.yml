name: escaperoom-dev

# Dependencias locales. Las apps corren fuera de Docker con `pnpm dev` y se
# conectan a PgBouncer en localhost:56433 (o directo a Postgres en 55433 para
# migraciones). Adaptado de SLXD (ADR-017): sin ClickHouse ni Gatus; se añaden
# LiveKit y coturn (specs/12).
#
# E-13: todos los puertos publicados se atan a 127.0.0.1 (no 0.0.0.0) — este
# compose es solo para desarrollo local, nunca debe quedar accesible desde
# fuera del host aunque el firewall del VPS/máquina esté mal configurado.
# Las imágenes van fijadas por tag+digest (no `latest`/tags flotantes): para
# actualizar una, `docker pull <imagen>:<tag-nuevo>` y sustituir el digest que
# imprime `docker inspect --format='{{index .RepoDigests 0}}' <imagen>:<tag>`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-escaperoom}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Pooler delante de Postgres (paridad con producción). En dev NO es el
  # default: tras un `migrate reset` los ENUMs se recrean y los planes cacheados
  # del pooler quedan inválidos. Dev va directo a Postgres (55433).
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-10}
      MAX_PREPARED_STATEMENTS: ${PGBOUNCER_MAX_PREPARED_STATEMENTS:-200}
    ports:
      - "127.0.0.1:${PGBOUNCER_PORT:-56433}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  # requirepass: antes sin contraseña (accesible a quien alcance el puerto).
  # REDIS_PASSWORD tiene un valor por defecto de desarrollo — cualquiera con
  # acceso al repo lo conoce, así que sigue siendo solo para dev (igual que
  # POSTGRES_PASSWORD arriba); en producción usa un REDIS_PASSWORD propio.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev_only}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_only}
    ports:
      - "127.0.0.1:${REDIS_PORT:-56380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3 compatible solo para desarrollo. En producción, Cloudflare R2.
  #
  # 2026-09-25: sustituye a MinIO (imagen borrada de Docker Hub y quay.io el
  # 2026-09-11, repo archivado desde 2026-02 — ver ADR-030). Mismo endpoint
  # (127.0.0.1:9002), mismas credenciales de dev (minioadmin/minioadmin) y
  # mismo bucket (escaperoom-assets) que antes: los `.env` existentes de cada
  # desarrollador siguen funcionando sin tocarlos. Las claves fijas viven en
  # infra/seaweedfs/s3.json (versionado, no es un secreto real). `weed server
  # -s3` arranca también el filer que el gateway S3 necesita (sin flag
  # aparte: lo activa automáticamente).
  seaweedfs:
    image: chrislusf/seaweedfs:latest@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -ip=seaweedfs
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9002}:8333"
      # UI del filer (navegar los ficheros subidos), equivalente a la consola
      # de MinIO que sustituye. No admite login propio: solo para dev.
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-59002}:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Los buckets no se crean solos: sin este paso la primera subida muere con
  # NoSuchBucket. La lista vive en infra/minio-dev/buckets.txt (nombre
  # histórico, se mantiene para no romper el path). Idempotente: usa
  # head-bucket antes de crear, así que un `docker compose up` repetido no
  # falla si el bucket ya existe en el volumen persistente.
  seaweedfs-init:
    image: amazon/aws-cli:2.37.2@sha256:e38214027df83cb6631adcf980a092a98d1d29788789bff2a0f424e87e3da8ed
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./minio-dev/buckets.txt:/buckets.txt:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -e;
        while read -r b; do
        case "$$b" in ''|\#*) continue ;; esac;
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket "$$b" 2>/dev/null
        || aws --endpoint-url http://seaweedfs:8333 s3 mb "s3://$$b";
        done < /buckets.txt

  # SFU de voz/webcam (specs/12). La room de medios vive y muere con la de
  # Colyseus; el SDK JS del cliente habla con 7880 (ws) y 7881/7882 (RTC).
  livekit:
    image: livekit/livekit-server:latest@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    command: --config /etc/livekit.yaml
    ports:
      - "127.0.0.1:${LIVEKIT_PORT:-7880}:7880"
      - "127.0.0.1:${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "127.0.0.1:${LIVEKIT_RTC_UDP_PORT:-7882}:7882/udp"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro

  # Servidor TURN/STUN para redes restrictivas (specs/12). En macOS el
  # networking de Docker limita TURN; en producción va en el VPS con red host.
  coturn:
    image: coturn/coturn:latest@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    command: -c /etc/coturn/turnserver.conf
    ports:
      - "127.0.0.1:${COTURN_PORT:-3478}:3478"
      - "127.0.0.1:${COTURN_PORT:-3478}:3478/udp"
      - "127.0.0.1:${COTURN_TLS_PORT:-5349}:5349"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

  # Monitor de disponibilidad (ticket 6.4, docs/specs/24 §6). Autohospedado,
  # sin API a integrar en código: se configura a mano desde su UI
  # (http://localhost:59003 en dev) contra `GET http://host.docker.internal:3000/api/health`
  # de `pnpm --filter @escaperoom/web dev` (fuera de Docker, en el host). Ver
  # docs/reference/alertas-uptime-kuma.md para el procedimiento de alerta.
  uptime-kuma:
    image: louislam/uptime-kuma:1@sha256:70233f4acb5163fd2a59a49909cf01e44415cecff13dba69e3a86647a2919f83
    ports:
      - "127.0.0.1:${UPTIME_KUMA_PORT:-59003}:3001"
    volumes:
      - uptime-kuma-data:/app/data

volumes:
  postgres-data:
  # minio-data (retirado 2026-09-25): NO se borra el volumen de Docker
  # existente, tiene datos de dev de quien lo tuviera creado; solo deja de
  # declararse aquí. `docker volume rm escaperoom-dev_minio-data` a mano si
  # quieres liberar el espacio.
  seaweedfs-data:
  uptime-kuma-data:
