name: escaperoom-dev

# Dependencias locales. Las apps corren fuera de Docker con `pnpm dev` y se
# conectan a PgBouncer en localhost:56433 (o directo a Postgres en 55433 para
# migraciones). Adaptado de SLXD (ADR-017): sin ClickHouse ni Gatus; se añaden
# LiveKit y coturn (specs/12).
#
# E-13: todos los puertos publicados se atan a 127.0.0.1 (no 0.0.0.0) — este
# compose es solo para desarrollo local, nunca debe quedar accesible desde
# fuera del host aunque el firewall del VPS/máquina esté mal configurado.
# Las imágenes van fijadas por tag+digest (no `latest`/tags flotantes): para
# actualizar una, `docker pull <imagen>:<tag-nuevo>` y sustituir el digest que
# imprime `docker inspect --format='{{index .RepoDigests 0}}' <imagen>:<tag>`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-escaperoom}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Pooler delante de Postgres (paridad con producción). En dev NO es el
  # default: tras un `migrate reset` los ENUMs se recrean y los planes cacheados
  # del pooler quedan inválidos. Dev va directo a Postgres (55433).
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-10}
      MAX_PREPARED_STATEMENTS: ${PGBOUNCER_MAX_PREPARED_STATEMENTS:-200}
    ports:
      - "127.0.0.1:${PGBOUNCER_PORT:-56433}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  # requirepass: antes sin contraseña (accesible a quien alcance el puerto).
  # REDIS_PASSWORD tiene un valor por defecto de desarrollo — cualquiera con
  # acceso al repo lo conoce, así que sigue siendo solo para dev (igual que
  # POSTGRES_PASSWORD arriba); en producción usa un REDIS_PASSWORD propio.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev_only}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_only}
    ports:
      - "127.0.0.1:${REDIS_PORT:-56380}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3 compatible solo para desarrollo. En producción, Cloudflare R2.
  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9002}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-59002}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - minio-data:/data

  # Los buckets no se crean solos: sin este paso la primera subida muere con
  # NoSuchBucket. La lista vive en infra/minio-dev/buckets.txt.
  minio-init:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio-dev/buckets.txt:/buckets.txt:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -e;
        mc alias set dev http://minio:9000
        "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin}";
        while read -r b; do
        case "$$b" in ''|\#*) continue ;; esac;
        mc mb -p "dev/$$b";
        done < /buckets.txt

  # SFU de voz/webcam (specs/12). La room de medios vive y muere con la de
  # Colyseus; el SDK JS del cliente habla con 7880 (ws) y 7881/7882 (RTC).
  livekit:
    image: livekit/livekit-server:latest@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3
    command: --config /etc/livekit.yaml
    ports:
      - "127.0.0.1:${LIVEKIT_PORT:-7880}:7880"
      - "127.0.0.1:${LIVEKIT_RTC_TCP_PORT:-7881}:7881"
      - "127.0.0.1:${LIVEKIT_RTC_UDP_PORT:-7882}:7882/udp"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro

  # Servidor TURN/STUN para redes restrictivas (specs/12). En macOS el
  # networking de Docker limita TURN; en producción va en el VPS con red host.
  coturn:
    image: coturn/coturn:latest@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
    command: -c /etc/coturn/turnserver.conf
    ports:
      - "127.0.0.1:${COTURN_PORT:-3478}:3478"
      - "127.0.0.1:${COTURN_PORT:-3478}:3478/udp"
      - "127.0.0.1:${COTURN_TLS_PORT:-5349}:5349"
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

  # Monitor de disponibilidad (ticket 6.4, docs/specs/24 §6). Autohospedado,
  # sin API a integrar en código: se configura a mano desde su UI
  # (http://localhost:59003 en dev) contra `GET http://host.docker.internal:3000/api/health`
  # de `pnpm --filter @escaperoom/web dev` (fuera de Docker, en el host). Ver
  # docs/reference/alertas-uptime-kuma.md para el procedimiento de alerta.
  uptime-kuma:
    image: louislam/uptime-kuma:1@sha256:70233f4acb5163fd2a59a49909cf01e44415cecff13dba69e3a86647a2919f83
    ports:
      - "127.0.0.1:${UPTIME_KUMA_PORT:-59003}:3001"
    volumes:
      - uptime-kuma-data:/app/data

volumes:
  postgres-data:
  minio-data:
  uptime-kuma-data:
