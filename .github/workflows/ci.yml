# CI de PR: lint + typecheck + test + build de todo el workspace (plan maestro §8).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# E-15: por defecto GITHUB_TOKEN es de solo lectura; cada job que necesite más
# (ninguno de este workflow) lo declara explícitamente.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # E-14: Postgres y Redis efímeros para que los *.integration.test.ts (los
    # stores de purga de PII y el DDL de particiones, entre otros) corran
    # también en CI en vez de saltarse (`describe.skipIf(!process.env.X)`).
    # SeaweedFS (storage S3 local, 2026-09-25) va como `docker run` en un paso
    # propio en vez de aquí: `services:` no admite pasar el CMD que necesita
    # (`server -s3 -s3.config=...`), solo arranca la imagen con su
    # ENTRYPOINT/CMD por defecto.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: escaperoom_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d escaperoom_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Variables mínimas para que build/typecheck/test corran contra la infra
      # efímera de arriba. NODE_ENV no es "production" aquí, así que la
      # validación estricta de entorno (E-4, de otro bloque) no exige más
      # secretos (JOIN_TOKEN_SECRET, APP_SECRET, BETTER_AUTH_*, EMAIL_*…): esos
      # siguen cayendo a los valores de desarrollo del propio código.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/escaperoom_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/escaperoom_ci
      REDIS_URL: redis://localhost:6379
      REDIS_PREFIX: escaperoom
      QUEUES_ENABLED: "true"
      STORAGE_PROVIDER: s3
      STORAGE_BUCKET: escaperoom-assets
      STORAGE_REGION: us-east-1
      STORAGE_ENDPOINT: http://localhost:9002
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # SeaweedFS: mismas claves fijas de dev que infra/docker-compose.dev.yml
      # (infra/seaweedfs/s3.json), mismo endpoint que declaran las variables
      # STORAGE_* de arriba. Bucket idempotente: si el `head-bucket` falla
      # (siempre, en un runner efímero) crea el bucket con `s3 mb`.
      - name: Arrancar SeaweedFS (S3 local para tests de integración)
        run: |
          set -e
          docker run -d --name seaweedfs \
            -p 9002:8333 \
            -v "$PWD/infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:latest@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882 \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip=0.0.0.0
          timeout 30 sh -c 'until curl -sf http://localhost:9002/status >/dev/null; do sleep 1; done'
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID=minioadmin -e AWS_SECRET_ACCESS_KEY=minioadmin -e AWS_DEFAULT_REGION=us-east-1 \
            amazon/aws-cli:2.37.2@sha256:e38214027df83cb6631adcf980a092a98d1d29788789bff2a0f424e87e3da8ed \
            s3api head-bucket --bucket escaperoom-assets --endpoint-url http://localhost:9002 2>/dev/null \
          || docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID=minioadmin -e AWS_SECRET_ACCESS_KEY=minioadmin -e AWS_DEFAULT_REGION=us-east-1 \
            amazon/aws-cli:2.37.2@sha256:e38214027df83cb6631adcf980a092a98d1d29788789bff2a0f424e87e3da8ed \
            s3 mb s3://escaperoom-assets --endpoint-url http://localhost:9002
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @escaperoom/shared db:migrate
      - run: pnpm turbo run lint typecheck test build
      - run: pnpm audit --prod

  # Subset E2E con navegador de cada PR (specs/22 §3.4, ticket 6.5): el smoke
  # del Rey Aldric (2 jugadores, pasos 1–6) contra web + colyseus-server +
  # editor-sync reales y Postgres efímero. La suite completa corre en nightly
  # (e2e-nightly.yml).
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: escaperoom_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d escaperoom_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # E-4: web y colyseus arrancan con NODE_ENV=production
      # (packages/e2e/scripts/serve.ts) y ahora exigen REDIS_URL al arrancar
      # (requireInProduction); mismo servicio que ya usa e2e-nightly.yml.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/escaperoom_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/escaperoom_e2e
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Colchón de memoria además de arrancar menos procesos (ver
      # playwright.config.ts): el runner (2 vCPU/7GB) sostiene a la vez
      # Postgres + web (next build+start) + colyseus-server + Chromium con 2
      # páginas, y bajo presión de RAM el navegador se cierra a mitad de test
      # ("Target page ... has been closed"), no es un fallo de la app.
      - uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c # v1.0
        with:
          swap-size-gb: 4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @escaperoom/shared build
      - run: pnpm --filter @escaperoom/e2e e2e:install
      - run: pnpm --filter @escaperoom/e2e e2e:smoke
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-smoke-report
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
            packages/e2e/.run/*.log
          retention-days: 7
